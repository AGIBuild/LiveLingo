name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Stage 1: Verify compilation
  compile:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Compile
        run: dotnet build LiveLingo.slnx -c Release --nologo

  # Stage 2: Run tests (on macOS: the product ships for Windows x64 and macOS arm64, the pinned llama.cpp runtimes)
  test:
    needs: compile
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compile.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh Build

      # The web tests drive WebKit and Chromium.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/LiveLingo.Web.Tests/*.csproj') }}

      - name: Install browsers for the web tests
        run: pwsh tests/LiveLingo.Web.Tests/bin/Release/net10.0/playwright.ps1 install webkit chromium

      - name: Test
        run: ./build.sh Test

  # Stage 3: Build platform-specific installers
  pack:
    needs: [compile, test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            shell: pwsh
          - os: macos-latest
            runtime: osx-arm64
            shell: bash

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compile.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack (Windows)
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./build.ps1 Pack PackMsi --skip Test --Runtime ${{ matrix.runtime }} --Version ${{ needs.compile.outputs.version }}

      - name: Pack (macOS)
        if: matrix.runtime == 'osx-arm64'
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh Pack --skip Test --Runtime ${{ matrix.runtime }} --Version ${{ needs.compile.outputs.version }}

      # The installers and what installed applications update from: the full package and its feed (releases.<channel>.json).
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.runtime }}
          path: |
            releases/*.exe
            releases/*.msi
            releases/*.pkg
            releases/*.nupkg
            releases/releases.*.json
            releases/RELEASES*
          if-no-files-found: error

  # Stage 4: Create the GitHub Release with the installers and the update feeds
  release:
    needs: [compile, pack]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release files
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: List release files
        run: ls -la installers/

      # An application only updates from a release whose feed names a package that is in it, so a release without one is not published.
      - name: Check the update feeds
        run: |
          for channel in win osx; do
            feed="installers/releases.${channel}.json"
            test -f "$feed" || { echo "Missing $feed"; exit 1; }
            jq -e --arg v "${{ needs.compile.outputs.version }}" \
              '[.Assets[] | select(.Version == $v and .Type == "Full")] | length == 1' "$feed" > /dev/null \
              || { echo "$feed has no full package for ${{ needs.compile.outputs.version }}"; exit 1; }
            for file in $(jq -r '.Assets[].FileName' "$feed"); do
              test -f "installers/$file" || { echo "$feed names $file, which was not built"; exit 1; }
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compile.outputs.tag }}
          name: LiveLingo ${{ needs.compile.outputs.tag }}
          prerelease: ${{ contains(needs.compile.outputs.version, '-') }}
          files: |
            installers/*.exe
            installers/*.msi
            installers/*.pkg
            installers/*.nupkg
            installers/releases.*.json
            installers/RELEASES*
          generate_release_notes: true
